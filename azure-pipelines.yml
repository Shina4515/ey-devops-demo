
trigger: none

pool:
  vmImage: ubuntu-latest

stages:
- stage: Validate
  jobs:
  - job: ValidateApp
    steps:
    - checkout: self
    - script: |
        test -f index.html
        test -f Containerfile
        echo "Validation successful"
      displayName: Validate application

- stage: Build
  dependsOn: Validate
  jobs:
  - job: CheckPodman
    steps:
    - script: |
        podman --version
      displayName: Check Podman availability
